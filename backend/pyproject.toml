[project]
name = "tirith-backend"
version = "0.1.0"
description = "Tirith backend: scanners, store, scope, posture, events"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "websockets>=17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
